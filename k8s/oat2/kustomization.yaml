apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mecaniqa
resources:
  - namespace.yaml
  - iot.yaml
  - hpa.yaml
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
  - name: grafana-datasource
    files:
      - grafana-datasource.yaml
  - name: grafana-dashboards-provider
    files:
      - grafana-dashboards-provider.yaml
  - name: grafana-dashboards
    files:
      - dashboards/01-cpu.json
      - dashboards/02-memoria.json
      - dashboards/03-erros.json
      - dashboards/04-sucessos.json
  - name: grafana-alerting
    files:
      - grafana-alerting.yaml
