services:
  db:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    image: mecaniqa-mysql:8.0
    container_name: mecaniqa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
      MYSQL_DATABASE: mecaniqa_db
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_dados:/var/lib/mysql
    networks:
      - mecaniqa-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  cache:
    build:
      context: .
      dockerfile: docker/redis/Dockerfile
    image: mecaniqa-redis:alpine
    container_name: mecaniqa-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_dados:/data
    networks:
      - mecaniqa-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: mecaniqa-api:1.1
    container_name: mecaniqa-java-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_HOST: cache
      REDIS_PORT: "6379"
    networks:
      - mecaniqa-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  mysql_dados:
  redis_dados:

networks:
  mecaniqa-net:
    driver: bridge
